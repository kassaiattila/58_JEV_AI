# The project's tool settings. The dependencies come from requirements.txt / requirements.lock (installation:
# docs/guides/SETUP.md); this file does not make the package installable, it only configures the quality tools.

[project]
name = "jav"
version = "1.75.0"  # Single version source; update the UI package descriptors and README with each release.
description = "A multilingual AI-flow framework for processing documents and emails (Burr + Pydantic AI + JEV)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "jev_refusal: the test checks the refusal of a JEV question in processing without JEV (160); without it the refusal fails the test",
    "slow: one of the slowest tests (over about 5 s); a quick loop may leave them out with -m \"not slow\", the full preflight runs them (167)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["runs", "store", "inbox", "tools", ".venv"]

[tool.ruff.lint]
# The rule set: syntax, imports, undefined names, compound statements.
select = ["E4", "E7", "E9", "F"]

[tool.jav.lint]
# Ratchet: the number of Ruff findings may not grow above this; lower it after a fix (preflight checks it).
max_findings = 0
