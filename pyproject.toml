# The project's tool settings. The dependencies come from requirements.txt / requirements.lock (installation:
# docs/guides/SETUP.md); this file does not make the package installable, it only configures the quality tools.

[project]
name = "jav"
version = "1.77.0"  # Single version source; update the UI package descriptors and README with each release.
description = "A multilingual AI-flow framework for processing documents and emails (Burr + Pydantic AI + JEV)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "jev_refusal: the test checks the refusal of a JEV question in processing without JEV (160); without it the refusal fails the test",
    "real_availability: the test asks whether an engine can run here from the environment itself (265); without it an installation with every key is assumed",
    "slow: one of the slowest tests (over about 5 s); a quick loop may leave them out with -m \"not slow\", the full preflight runs them (167)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["runs", "store", "inbox", "tools", ".venv"]

[tool.ruff.lint]
# The rule set: syntax, imports, undefined names, compound statements; 265 (code review TOOL-09): a blind
# `except Exception` (BLE001) and a swallowed exception (S110) need a stated reason, and an unused or inert `noqa` goes
# (RUF100).
select = ["E4", "E7", "E9", "F", "BLE001", "S110", "RUF100"]

[tool.jav.lint]
# Ratchet: the number of Ruff findings may not grow above this; lower it after a fix (preflight checks it).
max_findings = 0
# The Ruff version the ratchet is counted with (preflight fails with another one): uv tool install ruff==0.16.4
ruff_version = "0.16.4"
